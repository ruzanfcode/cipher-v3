<style>
:root{--viz-text:#111827;--viz-muted:#6b7280;--viz-border:#e5e7eb;--viz-panel:#fff;--viz-card:#f3f4f6;--viz-accent:#2563eb;--viz-accent-bg:#eff6ff;--viz-series-2:#16a34a;--viz-series-4:#dc2626;--viz-series-5:#d97706}
body{margin:0;background:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#compare-v9{--attr-w:68px;--prod-w:232px;max-width:1180px;margin:0 auto;padding:24px;color:var(--viz-text)}
#compare-v9 .pos{background:var(--viz-series-2)}#compare-v9 .mix{background:var(--viz-series-5)}#compare-v9 .neg{background:var(--viz-series-4)}
#compare-v9 .selector{box-sizing:border-box;border:1px solid var(--viz-border);transition:.15s}
#compare-v9 .selector.selected{border-color:var(--viz-accent);background:var(--viz-accent-bg);box-shadow:inset 0 0 0 1px var(--viz-accent)}
#compare-v9 .brand-freeze{position:sticky;top:0;z-index:120;display:flex;background:var(--viz-panel);border:1px solid var(--viz-border);border-bottom:0;border-radius:12px 12px 0 0;overflow:hidden}
#compare-v9 .brand-attr{width:var(--attr-w);min-width:var(--attr-w);display:flex;align-items:center;justify-content:center;background:var(--viz-card);border-right:1px solid var(--viz-border)}
#compare-v9 .brand-pin{width:var(--prod-w);min-width:var(--prod-w);background:var(--viz-card);border-right:2px solid var(--viz-border)}
#compare-v9 .brand-view{min-width:0;flex:1;overflow:hidden;background:var(--viz-card)}
#compare-v9 .brand-track{display:flex;width:max-content;will-change:transform}
#compare-v9 .brand-cell{width:var(--prod-w);min-width:var(--prod-w);box-sizing:border-box;border-right:1px solid var(--viz-border);background:var(--viz-card)}
#compare-v9 .pin-icon{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--viz-border);border-radius:8px;background:transparent;font-size:14px;box-sizing:border-box}
#compare-v9 .pin-icon.active{border-color:var(--viz-accent);background:var(--viz-accent-bg);box-shadow:inset 0 0 0 1px var(--viz-accent)}
#compare-v9 .compare-scroll{position:relative;isolation:isolate;border:1px solid var(--viz-border);border-top:0;border-radius:0 0 12px 12px;overflow-x:auto}
#compare-v9 .row{display:grid;position:relative;min-width:max-content;isolation:isolate}
#compare-v9 .attr-cell{position:sticky;left:0;z-index:80;width:var(--attr-w);min-width:var(--attr-w);box-sizing:border-box;background:var(--viz-panel);border-right:1px solid var(--viz-border);box-shadow:2px 0 0 var(--viz-border);overflow:hidden;contain:paint}
#compare-v9 .prod-cell{position:relative;z-index:1;width:var(--prod-w);min-width:var(--prod-w);box-sizing:border-box;background:var(--viz-panel);border-right:1px solid var(--viz-border);overflow:hidden;contain:paint}
#compare-v9 .prod-cell.pinned{position:sticky;left:var(--attr-w);z-index:60;background:var(--viz-panel)!important;box-shadow:3px 0 0 var(--viz-border);overflow:hidden;contain:paint;opacity:1}
#compare-v9 .quick-row .attr-cell,#compare-v9 .quick-row .prod-cell{background:var(--viz-card)}
#compare-v9 .attribute-row.active .attr-cell{background:var(--viz-accent-bg)}
#compare-v9 .attribute-row.active .prod-cell:not(.pinned){background:var(--viz-accent-bg)}
#compare-v9 .attribute-row.active .prod-cell.pinned{background:var(--viz-panel)!important;box-shadow:inset 0 0 0 2px var(--viz-accent),3px 0 0 var(--viz-border)}
#compare-v9 .bar{display:flex;position:relative;height:12px;overflow:hidden;isolation:isolate;border-radius:999px;background:var(--viz-card)}
#compare-v9 .segment{height:100%;border:0;padding:0;position:relative;z-index:1;cursor:pointer}
#compare-v9 .segment.selected{box-shadow:inset 0 0 0 2px var(--viz-text)}
#compare-v9 .attribute-row .rating{display:none !important}
#compare-v9 .tip{position:absolute;z-index:250;display:none;width:max-content;max-width:250px;padding:8px 10px;border:1px solid var(--viz-border);border-radius:8px;background:var(--viz-panel);box-shadow:0 6px 18px rgba(0,0,0,.12);font-size:11px;line-height:1.35;pointer-events:none}
#compare-v9 .tip.show{display:block}#compare-v9 .tip-title{display:block;font-size:11px;line-height:1.35;font-weight:600}#compare-v9 .tip2{display:block;margin-top:3px;color:var(--viz-muted);font-size:11px;line-height:1.35;font-weight:400}
#compare-v9 .filter-attr{width:29px;height:29px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;border:1px solid var(--viz-border);border-radius:999px;font-size:13px;font-weight:700}
#compare-v9 .filter-attr.active{border-color:var(--viz-accent);background:var(--viz-accent-bg);box-shadow:inset 0 0 0 1px var(--viz-accent)}
#compare-v9 .sent{width:58px;height:28px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;border:1px solid currentColor;border-radius:999px;font-size:10px;font-weight:500}
#compare-v9 .sent.active{background:var(--viz-card);box-shadow:inset 0 0 0 1.5px currentColor}
#compare-v9 .mode{width:34px;height:23px;box-sizing:border-box;font-size:9px;font-weight:600;padding:0}#compare-v9 .mode.active{background:var(--viz-accent-bg)}
#compare-v9 .star{width:23px;height:28px;padding:0;border:0;background:transparent;color:var(--viz-muted);font-size:19px;line-height:1}#compare-v9 .star.filled{color:var(--viz-text)}#compare-v9 .star.edge{border-radius:5px;background:var(--viz-accent-bg)}

#compare-v9 .combined-toggle{display:flex;padding:2px;border:1px solid var(--viz-border);border-radius:7px;background:var(--viz-panel)}
#compare-v9 .combined-toggle button{width:22px;height:23px;display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:5px;background:transparent;font-size:12px;line-height:1}
#compare-v9 .combined-toggle button.active{background:var(--viz-accent-bg);box-shadow:inset 0 0 0 1px var(--viz-accent)}
#compare-v9 .combined-viz{display:flex;align-items:center;justify-content:center}
#compare-v9 .combined-viz.bar-area{height:42px}
#compare-v9 .combined-viz.pie-area{height:72px}
#compare-v9 .combined-bar{width:100%}
#compare-v9 .combined-pie{width:64px;height:64px;overflow:visible}
#compare-v9 .combined-pie .pie-seg{cursor:pointer}


#compare-v9 .product-thumb{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;flex:0 0 34px;border:1px solid var(--viz-border);border-radius:8px;background:var(--viz-panel);overflow:hidden}
#compare-v9 .product-thumb svg{width:28px;height:28px}
#compare-v9 .filter-shell{border:1px solid var(--viz-border);border-radius:8px;background:var(--viz-panel)}
#compare-v9 .filter-toggle{min-height:30px;display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:600}
#compare-v9 .filter-badge{min-width:18px;height:18px;padding:0 5px;display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:var(--viz-accent-bg);font-size:9px;color:var(--viz-text)}
#compare-v9 .filter-panel.hidden{display:none}
#compare-v9 .image-modal{position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(17,24,39,.35)}
#compare-v9 .image-modal.hidden{display:none}
#compare-v9 .image-card{width:min(360px,92vw);border:1px solid var(--viz-border);border-radius:14px;background:var(--viz-panel);box-shadow:0 18px 50px rgba(0,0,0,.2);padding:16px}
#compare-v9 .image-large{height:250px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:var(--viz-card)}
#compare-v9 .image-large svg{width:150px;height:210px}


#compare-v9 .comments{height:620px;overflow-y:auto;overflow-x:hidden;padding-right:4px;scrollbar-gutter:stable}
#compare-v9 .comments .comment{min-height:54px}
#compare-v9 .comments-empty{height:100%;display:flex;align-items:center;justify-content:center}

#compare-v9 .comment{border-left:3px solid var(--viz-border)}#compare-v9 .comment.positive{border-left-color:var(--viz-series-2)}#compare-v9 .comment.mixed{border-left-color:var(--viz-series-5)}#compare-v9 .comment.negative{border-left-color:var(--viz-series-4)}
</style>

<style id="cipher-comparison-theme-v10">
/* =========================================================
   Cipher comparison theme
   ========================================================= */

:root{
  --viz-text:#171717 !important;
  --viz-muted:#62676A !important;
  --viz-border:rgba(24,24,24,.11) !important;
  --viz-panel:#F8FBFC !important;
  --viz-card:#D0E5F2 !important;
  --viz-accent:#79BDD9 !important;
  --viz-accent-bg:#E7F3F8 !important;

  /* semantic sentiment colours stay restrained */
  --viz-series-2:#4F806A !important;
  --viz-series-4:#A85E5E !important;
  --viz-series-5:#A67A45 !important;

  --cipher-bg:#F2F2F2;
  --cipher-blue:#D0E5F2;
  --cipher-blue-soft:#D0ECF2;
  --cipher-blue-strong:#8FC9E3;
  --cipher-ink:#171717;
  --cipher-muted:#62676A;
  --cipher-ease:cubic-bezier(.2,.75,.2,1);
}

html,
body,
body *,
body *::before,
body *::after,
button,
input,
textarea,
select,
option{
  font-family:"Google Sans Flex",Arial,sans-serif !important;
}

button,
input,
textarea,
select{
  font:inherit;
}

body{
  margin:0 !important;
  color:var(--cipher-ink) !important;
  background:
    radial-gradient(circle at 10% 5%,rgba(208,236,242,.26),transparent 27%),
    radial-gradient(circle at 92% 12%,rgba(208,229,242,.31),transparent 28%),
    radial-gradient(circle at 48% 100%,rgba(208,236,242,.15),transparent 32%),
    var(--cipher-bg) !important;
  min-height:100vh;
}

/* ---------------------------------------------------------
   Floating glass nav — same Cipher language as Product Detail
   --------------------------------------------------------- */
.cipher-compare-nav-shell{
  width:min(calc(100% - 48px),1180px);
  margin-inline:auto;
  position:sticky;
  top:16px;
  z-index:500;
  padding-top:16px;
}

.cipher-compare-nav{
  position:relative;
  overflow:hidden;
  min-height:58px;
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:18px;
  padding:8px 10px 8px 14px;
  border:1px solid rgba(255,255,255,.52);
  border-radius:999px;
  background:rgba(208,229,242,.37);
  -webkit-backdrop-filter:blur(26px) saturate(118%);
  backdrop-filter:blur(26px) saturate(118%);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.76),
    inset 0 -1px 0 rgba(106,132,145,.08),
    0 12px 34px rgba(39,55,64,.055);
}

.cipher-compare-nav::before{
  content:"";
  position:absolute;
  left:3px;
  right:3px;
  top:2px;
  height:42%;
  border-radius:inherit;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0));
  z-index:0;
}

.cipher-compare-nav > *{
  position:relative;
  z-index:1;
}

.cipher-compare-brand{
  justify-self:start;
  display:inline-flex;
  align-items:center;
  gap:9px;
  min-height:38px;
  padding:0 9px 0 5px;
  border:0;
  background:transparent;
  color:#171717;
  cursor:pointer;
}

.cipher-compare-mark{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#171717;
  position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}

.cipher-compare-mark::before,
.cipher-compare-mark::after{
  content:"";
  position:absolute;
  left:7px;
  right:7px;
  height:2px;
  border-radius:999px;
  background:#fff;
}

.cipher-compare-mark::before{top:10px;}
.cipher-compare-mark::after{top:17px;}

.cipher-compare-wordmark{
  font-size:15px;
  font-weight:760;
  letter-spacing:-.025em;
}

.cipher-compare-links{
  justify-self:center;
  display:flex;
  align-items:center;
  gap:52px;
}

.cipher-compare-links a{
  position:relative;
  color:#525252;
  font-size:12px;
  font-weight:620;
  text-decoration:none;
  padding:8px 2px 11px;
  transition:color .22s ease,transform .22s ease,font-weight .22s ease;
}

.cipher-compare-links a::after{
  content:"";
  position:absolute;
  left:0;
  right:0;
  bottom:4px;
  height:2px;
  border-radius:999px;
  background:#111;
  transform:scaleX(0);
  transform-origin:center;
  opacity:0;
  transition:transform .24s var(--cipher-ease),opacity .2s ease;
}

.cipher-compare-links a:hover,
.cipher-compare-links a:focus-visible{
  color:#171717;
  transform:translateY(-1px);
}

.cipher-compare-links a:hover::after,
.cipher-compare-links a:focus-visible::after{
  transform:scaleX(1);
  opacity:.58;
}

.cipher-compare-links a.selected{
  color:#000;
  font-weight:780;
}

.cipher-compare-links a.selected::after{
  transform:scaleX(1);
  opacity:1;
}

.cipher-compare-back{
  justify-self:end;
  min-height:40px;
  display:inline-flex;
  align-items:center;
  gap:7px;
  padding:0 14px;
  border:0;
  border-radius:999px;
  background:#171717;
  color:#fff;
  font-size:11px;
  font-weight:680;
  cursor:pointer;
  box-shadow:0 8px 20px rgba(23,23,23,.12);
  transition:transform .2s var(--cipher-ease),box-shadow .2s ease;
}

.cipher-compare-back:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 26px rgba(23,23,23,.16);
}

.cipher-compare-back svg{
  width:16px;
  height:16px;
}

   --------------------------------------------------------- */

<style id="cipher-comparison-v11-images-pin-donut">

   ========================================================= */

const copy={fit:{positive:'Fit feels balanced and true to size.',mixed:'Fit works in some areas but not others.',negative:'Sizing feels inconsistent.'},comfort:{positive:'Comfort remains good through longer wear.',mixed:'Comfort is inconsistent over time.',negative:'The garment becomes uncomfortable.'},material:{positive:'Fabric feels substantial and pleasant.',mixed:'Material has strengths and drawbacks.',negative:'Fabric feels thinner than expected.'},aesthetic:{positive:'Silhouette looks flattering and current.',mixed:'Styling is appealing but inconsistent.',negative:'Shape looks less flattering in person.'},value:{positive:'Feels worth the price.',mixed:'Value depends on priorities.',negative:'Quality does not justify the price.'},quality:{positive:'Overall construction feels dependable.',mixed:'Some areas feel stronger than others.',negative:'Overall build feels weaker than expected.'},durability:{positive:'Has held its shape after repeated wear.',mixed:'Durability is acceptable but inconsistent.',negative:'Wear appeared earlier than expected.'},workmanship:{positive:'Seams and finishing are clean.',mixed:'Finishing is inconsistent in places.',negative:'Some stitching feels weak.'},performance:{positive:'Performs well during activity.',mixed:'Works better for some activities.',negative:'Performance drops during movement.'},functionality:{positive:'Functional details are useful.',mixed:'Details are useful but could improve.',negative:'Some details make it less practical.'}};

function showTip(el,l1,l2=''){tip.innerHTML=`<span class="tip-title">${l1}</span><span class="tip2">${l2||'More details'}</span>`;tip.classList.add('show');const rr=root.getBoundingClientRect(),er=el.getBoundingClientRect(),w=Math.min(250,tip.offsetWidth||250),h=tip.offsetHeight||45;let left=er.left-rr.left+er.width/2-w/2;left=Math.max(8,Math.min(left,rr.width-w-8));let top=er.top-rr.top-h-8;if(top<8)top=er.bottom-rr.top+8;tip.style.left=left+'px';tip.style.top=top+'px'}

<script id="cipher-comparison-nav-js">
(() => {
  const fallbackPrevious =
    'garment_sentiment_ui_v25_sort_tooltips_no_card_lift.html';

  function goToPreviousView() {
    if (window.history.length > 1) {
      window.history.back();
      return;
    }

    if (document.referrer) {
      try {
        window.location.href = document.referrer;
        return;
      } catch (_) {}
    }

    window.location.href = fallbackPrevious;
  }

  const backBtn = document.getElementById('cipher-compare-back');
  const brandBtn = document.getElementById('cipher-compare-home');

  backBtn?.addEventListener('click', goToPreviousView);
  brandBtn?.addEventListener('click', goToPreviousView);

  document.querySelectorAll('[data-compare-nav]').forEach(link => {
    link.addEventListener('click', event => {
      event.preventDefault();

      const target = link.dataset.compareNav;
      if (target === 'discover') {
        goToPreviousView();
        return;
      }

      document.querySelectorAll('[data-compare-nav]').forEach(item => {
        item.classList.toggle('selected', item === link);
      });
    });
  });
})();
</script>
